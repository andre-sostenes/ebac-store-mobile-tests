name: Mobile CI - BrowserStack

on:
  push:
    branches: [ci]
  workflow_dispatch:
    inputs:
      suite:
        description: Suite do WDIO
        type: choice
        options: [checkout, login, search, product]
        default: checkout
      device:
        description: Device no BrowserStack
        type: string
        default: iPhone 15
      os_version:
        description: Versão do iOS
        type: string
        default: '17'

permissions:
  contents: read

concurrency:
  group: browserstack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-tests:
    name: iOS - ${{ inputs.device || 'iPhone 15' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ENVIRONMENT: browserstack
      REPORTER: 'true'
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BROWSERSTACK_DEVICE_NAME: ${{ inputs.device || 'iPhone 15' }}
      BROWSERSTACK_OS_VERSION: ${{ inputs.os_version || '17' }}
      BROWSERSTACK_PROJECT: EBAC Store
      BROWSERSTACK_BUILD: ebac-store-ios-gh-${{ github.run_number }}
      BROWSERSTACK_NAME: EBAC Store - Checkout iOS (GH #${{ github.run_number }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validar credenciais do BrowserStack
        env:
          HAS_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME != '' }}
          HAS_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY != '' }}
        run: |
          echo "BROWSERSTACK_USERNAME configurado: $HAS_USERNAME"
          echo "BROWSERSTACK_ACCESS_KEY configurado: $HAS_ACCESS_KEY"
          if [ "$HAS_USERNAME" != "true" ] || [ "$HAS_ACCESS_KEY" != "true" ]; then
            echo "::error::Configure os secrets BROWSERSTACK_USERNAME e BROWSERSTACK_ACCESS_KEY em Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

      - name: Instalar dependências
        run: npm ci

      - name: Baixar app (.ipa para device real)
        run: |
          mkdir -p app
          curl -fsSL --retry 3 \
            -o app/LojaEBAC.ipa \
            https://raw.githubusercontent.com/EBAC-QE/ebac-store-mobile-tests/ios/app/LojaEBAC.ipa
          ls -lh app/LojaEBAC.ipa

      - name: Enviar app para o BrowserStack
        run: node scripts/bs-upload.mjs app/LojaEBAC.ipa

      - name: Executar testes no BrowserStack App Automate
        run: npx wdio run ./config/wdio.conf.js --suite "${{ inputs.suite || 'checkout' }}"

      - name: Coletar vídeo e logs
        if: always()
        run: node scripts/bs-artifacts.mjs

      - name: Publicar artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-artifacts-${{ github.run_number }}
          path: |
            browserstack-artifacts/
            allure-results/
          if-no-files-found: warn
          retention-days: 30
